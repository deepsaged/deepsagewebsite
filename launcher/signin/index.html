<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in to Deepsage Launcher · DeepSage</title>
  <link rel="icon" href="/assets/favicon.png">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1b2838; color: #c7d5e0; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
    .card { width: 380px; padding: 32px; background: linear-gradient(to bottom, #2a3442, #1b2838); box-shadow: 0 10px 40px #000; display: flex; flex-direction: column; gap: 12px; }
    h1 { margin: 0; color: #fff; font-weight: 400; font-size: 24px; }
    p { margin: 0; font-size: 14px; line-height: 1.5; }
    .muted { color: #8f98a0; font-size: 13px; }
    button { font: inherit; cursor: pointer; border: none; border-radius: 2px; padding: 10px 16px; color: #fff; background: linear-gradient(to right, #47bfff 5%, #1a44c2 60%); }
    button.google { background: #fff; color: #222; }
    button.link { background: none; color: #66c0f4; padding: 4px; }
    input { font: inherit; color: #c7d5e0; background: #0e141b; border: 1px solid #2f3e4f; border-radius: 3px; padding: 8px 10px; }
    form { display: flex; flex-direction: column; gap: 8px; }
    .err { color: #d9534f; font-size: 13px; min-height: 1em; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Deepsage Launcher</h1>
    <div id="invalid" hidden>
      <p>This sign-in link is incomplete or has expired.</p>
      <p class="muted">Start sign-in again from the launcher.</p>
    </div>
    <div id="signin" hidden>
      <p class="muted">Sign in with your deepsage.com account to connect the launcher.</p>
      <div id="current" hidden>
        <p>Signed in as <strong id="current-name"></strong>.</p>
        <button id="continue">Continue as this account</button>
        <button class="link" id="other">Use another account</button>
      </div>
      <div id="choose">
        <button class="google" id="google">Continue with Google</button>
        <p class="muted" style="text-align:center">or</p>
        <form id="email-form">
          <input type="email" id="email" placeholder="Email" autocomplete="email" required>
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" required minlength="6">
          <button type="submit">Sign in</button>
        </form>
      </div>
      <div class="err" id="error"></div>
    </div>
    <div id="done" hidden>
      <p>Returning you to the launcher…</p>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithEmailAndPassword,
      signInWithPopup,
      onAuthStateChanged,
      signOut,
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAjiW7UXat-UHZBFCBXhZdlPz64Zpwkjbo",
      authDomain: "deepsage-aac5a.firebaseapp.com",
      projectId: "deepsage-aac5a",
      storageBucket: "deepsage-aac5a.firebasestorage.app",
      messagingSenderId: "10532051582",
      appId: "1:10532051582:web:029846f62f0edd01f3162f",
      measurementId: "G-33MSQXQ8G9",
    };

    // The launcher opens /launcher/signin/?port=<loopback port>&state=<nonce>.
    const params = new URLSearchParams(location.search);
    const port = params.get("port") || "";
    const state = params.get("state") || "";
    const valid = /^\d{2,5}$/.test(port) && Number(port) >= 1024 && Number(port) <= 65535 && /^[A-Za-z0-9]{32}$/.test(state);
    const $ = (id) => document.getElementById(id);

    // Hand the Firebase refresh token to the launcher's 127.0.0.1 listener in a
    // form POST body: it never appears in a URL, the history or a Referer.
    function returnToLauncher(user) {
      $("signin").hidden = true;
      $("done").hidden = false;
      const form = document.createElement("form");
      form.method = "POST";
      form.action = `http://127.0.0.1:${port}/callback`;
      for (const [name, value] of [["state", state], ["refresh_token", user.refreshToken]]) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = name;
        input.value = value;
        form.appendChild(input);
      }
      document.body.appendChild(form);
      form.submit();
    }

    function showError(e) {
      const code = (e && e.code) || "";
      $("error").textContent =
        code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")
          ? "Wrong email or password."
          : code.includes("popup-closed") ? "" : "Sign-in failed. Please try again.";
    }

    if (!valid) {
      $("invalid").hidden = false;
    } else {
      const auth = getAuth(initializeApp(firebaseConfig));
      $("signin").hidden = false;
      onAuthStateChanged(auth, (user) => {
        $("current").hidden = !user;
        $("choose").hidden = !!user;
        if (user) $("current-name").textContent = user.displayName || user.email || "";
      });
      $("continue").onclick = () => auth.currentUser && returnToLauncher(auth.currentUser);
      $("other").onclick = () => signOut(auth);
      $("google").onclick = async () => {
        try {
          const cred = await signInWithPopup(auth, new GoogleAuthProvider());
          returnToLauncher(cred.user);
        } catch (e) { showError(e); }
      };
      $("email-form").onsubmit = async (ev) => {
        ev.preventDefault();
        try {
          const cred = await signInWithEmailAndPassword(auth, $("email").value, $("password").value);
          returnToLauncher(cred.user);
        } catch (e) { showError(e); }
      };
    }
  </script>
</body>
</html>
